name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate galaxy-themed snake from contribution grid
        uses: Platane/snk@v3
        with:
          github_user_name: Sakshamxx
          outputs: |
            dist/github-snake.svg?color_snake=#ff2e88&color_dots=0d1117,1b1035,4361ee,4cc9f0,ff2e88
            dist/github-snake-fallback.svg?palette=github-dark

      - name: Push snake output to the "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
